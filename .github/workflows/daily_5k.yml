name: Run daily_5k daily

on:
  schedule:
    - cron: "0 3 * * *"  # every day at 03:00 UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest dataset from GitHub Release (if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p core/data
          gh release download dataset-latest -p "players_stats_5k.csv" -D core/data || echo "No previous dataset found (first run)."

      - name: Run players_stats.py
        run: |
          python core/scripts/players_stats_5k.py

      - name: Upload updated dataset to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view dataset-latest >/dev/null 2>&1 || gh release create dataset-latest -t "Dataset (latest)" -n "Auto-updated by GitHub Actions."
          gh release upload dataset-latest core/data/players_stats_5k.csv --clobber
